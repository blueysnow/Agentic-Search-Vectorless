[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-search-mongo"
version = "0.1.0"
description = "Vectorless/Agentic RAG System on MongoDB"
requires-python = ">=3.12"
dependencies = [
    "pymongo[srv]>=4.9",
    "motor>=3.6",
    "anthropic>=0.40",
    "openai>=1.55",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "tiktoken>=0.8",
    "pypdf>=4.0",
    "PyMuPDF>=1.24",
    "pymupdf4llm>=0.0.17",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: tests that require real MongoDB and LLM services",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src"]
