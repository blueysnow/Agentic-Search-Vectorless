MEMORY_NOTES:
  learnings:
    - "Error boundaries must be client components with 'use client' directive (Next.js 15 requirement)"
    - "React.cache() requires unique IDs per test call to avoid cache hits giving false test passes"
    - "Structured error messages must include: status code, status text, and resource context"
    - "Parse error logging to console.error() is critical for production debugging"
    - "TDD methodology catches cache invalidation bugs early - RED phase validates test correctness"
    - "HIGH priority issues can be deferred when they require features not yet implemented"
    - "Premature optimization avoided: timeouts/retries/handlers configured when actually needed"

  patterns:
    - "Error format for client API: '{detail} ({status})' - preserves both server message and HTTP code"
    - "Error format for server API: 'Failed to fetch {resource} {id}: {status} {statusText}' - full context"
    - "Always wrap JSON parsing in try/catch and log parse errors with console.error()"
    - "Error boundaries provide two recovery paths: reset() to retry, home link to escape"
    - "Show generic error messages in production (security), detailed in development (debugging)"
    - "Test error boundaries by verifying: render, reset callback, home link, dev vs prod messages"
    - "Server fetch tests must use unique resource IDs to avoid React.cache() cross-test pollution"
    - "Defer HIGH issues with clear rationale rather than implementing unused/untestable code"

