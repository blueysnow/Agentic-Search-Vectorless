# mongot configuration for Community Search
# Sync from mongod via gRPC, expose health + metrics

syncSource:
  replicaSet:
    hostAndPort: "mongodb-search:27017"
    username: "mongotUser"
    passwordFile: "/auth/passwordFile"
    authSource: "admin"
    tls: false

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    address: "mongot:27028"

metrics:
  enabled: true
  address: "mongot:9946"

healthCheck:
  address: "mongot:8080"

logging:
  verbosity: INFO
