services:
  # === DEFAULT MODE (no profile) ===
  # MongoDB 7.0+ with replica set (simple, no auth, no search)
  mongodb:
    image: mongo:7.0
    container_name: agentic-search-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"  # Bind to localhost only for security
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --eval "
          try {
            rs.status().ok
          } catch(e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]});
            1;
          }
        "
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # === SEARCH PROFILE ===
  # Generate passwordFile required by mongot (even though mongod skips auth)
  setup-generator:
    image: alpine:3.19
    profiles: [search]
    container_name: agentic-search-setup
    command: ["/bin/sh", "-c", "apk add --no-cache openssl && /bin/sh /scripts/setup-generator.sh"]
    volumes:
      - search_auth:/auth
      - ./docker/search/setup-generator.sh:/scripts/setup-generator.sh:ro
    networks:
      - app-network

  # MongoDB Community Server with mongot support
  # Custom entrypoint: Phase 1 creates users (no setParameter), Phase 2 starts
  # mongod with full config (setParameter for mongot). This avoids the default
  # entrypoint which merges setParameter into the temp mongod, causing it to
  # hang waiting for mongot that isn't started yet.
  mongodb-search:
    image: mongodb/mongodb-community-server:8.0.4-ubi9
    profiles: [search]
    container_name: agentic-search-mongodb-search
    entrypoint: ["/bin/bash", "/scripts/start-mongod.sh"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_search_data:/data/db
      - search_auth:/auth
      - ./docker/search/mongod.conf:/etc/mongod.conf:ro
      - ./docker/search/mongod-init.conf:/etc/mongod-init.conf:ro
      - ./docker/search/start-mongod.sh:/scripts/start-mongod.sh:ro
    healthcheck:
      test: >
        mongosh --host 127.0.0.1 -u admin -p adminPass123 --authenticationDatabase admin --quiet --eval "
          rs.status().ok
        "
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    depends_on:
      setup-generator:
        condition: service_completed_successfully
    networks:
      - app-network

  # mongot (Lucene search engine for $search support)
  mongot:
    image: mongodb/mongodb-community-search:latest
    profiles: [search]
    container_name: agentic-search-mongot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp /auth/passwordFile /tmp/passwordFile
        chmod 400 /tmp/passwordFile
        exec /mongot-community/mongot --config /etc/mongot.conf
    volumes:
      - mongot_data:/data/mongot
      - search_auth:/auth:ro
      - ./docker/search/mongot.conf:/etc/mongot.conf:ro
    ports:
      - "127.0.0.1:8080:8080"    # Health check
      - "127.0.0.1:9946:9946"    # Metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mongodb-search:
        condition: service_healthy
    networks:
      - app-network

  # FastAPI backend (port 8002)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-search-backend
    ports:
      - "8002:8002"
    env_file:
      - path: .env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - MONGODB_DATABASE=agentic_search
      - PORT=8002
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # Next.js frontend (port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002
    container_name: agentic-search-frontend
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:8002
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongodb_data:
  mongodb_search_data:
  mongot_data:
  search_auth:

networks:
  app-network:
    driver: bridge
